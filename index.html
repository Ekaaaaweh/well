<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eid Mubarak Photobooth 🌙</title>
    
    <style>
        :root {
            --emerald: #064e3b;
            --gold: #d4af37;
            --white: #ffffff;
            --glass: rgba(255, 255, 255, 0.15);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #064e3b 0%, #065f46 100%);
            background-attachment: fixed;
            color: var(--white);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            text-align: center;
            background: var(--glass);
            backdrop-filter: blur(15px);
            padding: 30px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        h1 { color: var(--gold); margin-bottom: 5px; font-size: 1.8rem; }
        .subtitle { opacity: 0.8; font-size: 0.9rem; margin-bottom: 20px; }

        /* Input Nama */
        .input-group {
            margin-bottom: 15px;
        }
        input[type="text"] {
            width: 80%;
            padding: 10px 15px;
            border-radius: 25px;
            border: none;
            outline: none;
            background: rgba(255, 255, 255, 0.9);
            color: var(--emerald);
            font-weight: bold;
            text-align: center;
        }

        /* Kamera */
        .booth-wrapper {
            position: relative;
            border: 4px solid var(--gold);
            border-radius: 20px;
            overflow: hidden;
            background: #000;
            margin-bottom: 20px;
            line-height: 0;
        }

        #video { width: 100%; height: auto; transform: scaleX(-1); }

        #frame-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            border: 15px solid transparent;
            /* Menggunakan Border Emas Sederhana sebagai pengganti frame.png */
            box-shadow: inset 0 0 0 10px var(--gold);
            z-index: 10;
        }

        /* Tombol */
        .controls { display: flex; flex-direction: column; gap: 10px; }
        
        button {
            padding: 15px;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1rem;
        }

        #snap { background: var(--gold); color: var(--emerald); }
        #snap:hover { transform: translateY(-3px); background: #ffdf7e; }

        #download { background: var(--white); color: var(--emerald); display: none; }

        /* Hasil */
        #result-container {
            margin-top: 25px;
            display: none;
            border-top: 1px solid rgba(255,255,255,0.2);
            padding-top: 20px;
        }

        #photo { width: 100%; border-radius: 15px; border: 2px solid var(--gold); }
        
        .status-msg { font-size: 0.8rem; margin-top: 10px; color: #99ffbb; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🌙 Eid Photobooth</h1>
            <p class="subtitle">Ambil foto & otomatis kirim ke Discord!</p>
        </header>

        <div class="input-group">
            <input type="text" id="username" placeholder="Masukkan Namamu..." required>
        </div>

        <div class="booth-wrapper">
            <video id="video" autoplay playsinline></video>
            <div id="frame-overlay"></div>
        </div>

        <div class="controls">
            <button id="snap">Ambil & Kirim Foto 📸</button>
            <button id="download">Simpan ke HP/Laptop ✨</button>
        </div>

        <div id="result-container">
            <p>Hasil Foto:</p>
            <img id="photo" alt="Hasil">
            <p id="status" class="status-msg"></p>
        </div>

        <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <script>
        // KONFIGURASI WEBHOOK DISCORD
        const DISCORD_WEBHOOK_URL = 'https://discord.com/api/webhooks/1463473630251061375/xi6CyaH0ElCz_jUz9vf_iFfOxfNuh1iZfX_31GAO7jOcxRjkhd723nbEFd3ZAp1YvhME';

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const snap = document.getElementById('snap');
        const photo = document.getElementById('photo');
        const downloadBtn = document.getElementById('download');
        const usernameInput = document.getElementById('username');
        const statusMsg = document.getElementById('status');
        const resultContainer = document.getElementById('result-container');
        const context = canvas.getContext('2d');

        // 1. Akses Kamera
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
            } catch (err) {
                alert("Gagal akses kamera: " + err);
            }
        }

        // 2. Fungsi Kirim ke Discord
        async function sendToDiscord(blob, name) {
            statusMsg.innerText = "⏳ Sedang mengirim ke Discord...";
            
            const formData = new FormData();
            formData.append('file', blob, 'eid-photo.png');
            formData.append('content', `🌙 **Foto Idul Fitri Baru!**\n👤 Pengirim: **${name || 'Anonim'}**`);

            try {
                const response = await fetch(DISCORD_WEBHOOK_URL, {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    statusMsg.innerText = "✅ Foto berhasil terkirim ke Discord!";
                } else {
                    statusMsg.innerText = "❌ Gagal mengirim. Cek Webhook URL.";
                }
            } catch (error) {
                statusMsg.innerText = "❌ Error koneksi.";
            }
        }

        // 3. Logika Ambil Foto
        snap.addEventListener('click', () => {
            const name = usernameInput.value.trim();
            if(!name) {
                alert("Tulis namamu dulu ya!");
                return;
            }

            // Atur ukuran canvas
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            // Gambar Mirror
            context.save();
            context.scale(-1, 1);
            context.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
            context.restore();

            // Tambahkan Bingkai Emas di Hasil Foto
            context.strokeStyle = "#d4af37";
            context.lineWidth = 30;
            context.strokeRect(0, 0, canvas.width, canvas.height);

            // Tampilkan Gambar
            const dataURL = canvas.toDataURL('image/png');
            photo.src = dataURL;
            resultContainer.style.display = 'block';
            downloadBtn.style.display = 'block';

            // Kirim Blob ke Discord
            canvas.toBlob((blob) => {
                sendToDiscord(blob, name);
            }, 'image/png');
        });

        // 4. Download Foto
        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = `Eid-${usernameInput.value}.png`;
            link.href = photo.src;
            link.click();
        });

        initCamera();
    </script>
</body>
