<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Day For You ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #ff758c;
            --secondary: #ff7eb3;
            --text: #2d3436;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Overlay Awal */
        #welcome-screen {
            position: fixed;
            inset: 0;
            background: white;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: transform 1s cubic-bezier(0.77, 0, 0.175, 1);
        }

        /* Card Utama */
        .card {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 40px;
            border-radius: 30px;
            width: 85%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.2);
            transform: translateY(50px);
            opacity: 0;
            transition: 1s all ease-out;
        }

        .card.show {
            transform: translateY(0);
            opacity: 1;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 5px solid white;
            margin-bottom: 20px;
            object-fit: cover;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3rem;
            margin: 0;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        p {
            color: white;
            font-size: 1.1rem;
            line-height: 1.6;
            margin: 20px 0;
        }

        .btn-main {
            background: white;
            color: var(--primary);
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .btn-main:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }

        /* Float Animasi */
        .floating {
            animation: floating 3s ease-in-out infinite;
        }

        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        #cake { font-size: 50px; margin: 10px 0; }
    </style>
</head>
<body>

    <div id="welcome-screen">
        <h2 style="color: var(--primary); margin-bottom: 20px;">Halo Kamu! ✨</h2>
        <button class="btn-main" onclick="openGift()" style="background: var(--primary); color: white;">Buka Sesuatu</button>
    </div>

    <div class="card" id="mainCard">
        <div class="floating">
            <img src="https://via.placeholder.com/150" alt="Birthday Person" class="profile-img">
        </div>
        <div id="cake">🎂</div>
        <h1>Happy Birthday!</h1>
        <p>Di hari yang spesial ini, aku cuma mau bilang terima kasih sudah menjadi orang yang luar biasa. Semoga tahun ini membawa banyak kebahagiaan untukmu!</p>
        <button class="btn-main" onclick="makeWish()">Make a Wish! ✨</button>
    </div>

    <script>
        function openGift() {
            // Sembunyikan layar awal
            document.getElementById('welcome-screen').style.transform = 'translateY(-100%)';
            
            // Tampilkan kartu utama
            setTimeout(() => {
                document.getElementById('mainCard').classList.add('show');
                fireConfetti();
            }, 500);
        }

        function makeWish() {
            fireConfetti();
            alert("Semoga semua keinginanmu terkabul! 🥳✨");
        }

        function fireConfetti() {
            var duration = 3 * 1000;
            var end = Date.now() + duration;

            (function frame() {
              confetti({
                particleCount: 3,
                angle: 60,
                spread: 55,
                origin: { x: 0 },
                colors: ['#ffffff', '#ff758c']
              });
              confetti({
                particleCount: 3,
                angle: 120,
                spread: 55,
                origin: { x: 1 },
                colors: ['#ffffff', '#ff758c']
              });

              if (Date.now() < end) {
                requestAnimationFrame(frame);
              }
            }());
        }
    </script>
</body>
</html>
