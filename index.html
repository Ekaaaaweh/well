<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eid Mubarak Photobooth</title>
    <style>
        /* CSS SEDERHANA & BERSIH */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        .booth-container {
            position: relative;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            line-height: 0;
            margin-bottom: 15px;
        }
        #video {
            width: 100%;
            height: auto;
            transform: scaleX(-1); /* Mirror view */
        }
        #frame-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: 15px solid rgba(212, 175, 55, 0.5); /* Frame simple */
            pointer-events: none;
            box-sizing: border-box;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        button {
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        #snap { background-color: #064e3b; color: white; }
        #download { background-color: #d4af37; color: white; display: none; }
        #result-container {
            margin-top: 20px;
            display: none;
        }
        #photo {
            width: 100%;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🌙 Eid Photobooth</h1>
        <p>Ambil foto keceriaanmu dan bagikan!</p>

        <div class="booth-container">
            <video id="video" autoplay playsinline></video>
            <div id="frame-overlay"></div>
        </div>

        <div class="controls">
            <input type="text" id="username" placeholder="Masukkan namamu..." required>
            <button id="snap">Ambil & Kirim Foto 📸</button>
            <button id="download">Simpan Foto ✨</button>
        </div>

        <div id="result-container">
            <p id="status"></p>
            <img id="photo" alt="Hasil foto kamu">
        </div>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        // MASUKKAN WEBHOOK DISCORD KAMU
        const DISCORD_WEBHOOK_URL = 'https://discord.com/api/webhooks/1463473630251061375/xi6CyaH0ElCz_jUz9vf_iFfOxfNuh1iZfX_31GAO7jOcxRjkhd723nbEFd3ZAp1YvhME';

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const snap = document.getElementById('snap');
        const photo = document.getElementById('photo');
        const downloadBtn = document.getElementById('download');
        const usernameInput = document.getElementById('username');
        const resultContainer = document.getElementById('result-container');
        const statusText = document.getElementById('status');
        const context = canvas.getContext('2d');

        // Akses Kamera Langsung (Seperti Web Awal)
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => {
                video.srcObject = stream;
            })
            .catch(err => {
                alert("Mohon izinkan akses kamera!");
                console.error(err);
            });

        // Ambil Foto & Kirim
        snap.addEventListener('click', () => {
            const name = usernameInput.value.trim();
            if (!name) {
                alert("Isi nama dulu ya!");
                return;
            }

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            // Gambar (Proses mirror agar hasil tidak terbalik)
            context.save();
            context.scale(-1, 1);
            context.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
            context.restore();

            // Tambah Frame Sederhana
            context.strokeStyle = "#d4af37";
            context.lineWidth = 40;
            context.strokeRect(0, 0, canvas.width, canvas.height);

            const dataURL = canvas.toDataURL('image/png');
            photo.src = dataURL;
            resultContainer.style.display = 'block';
            downloadBtn.style.display = 'block';

            // Kirim ke Discord
            canvas.toBlob(blob => {
                const formData = new FormData();
                formData.append('file', blob, 'foto.png');
                formData.append('content', `📸 Foto baru dari: **${name}**`);

                statusText.innerText = "Mengirim ke Discord...";
                
                fetch(DISCORD_WEBHOOK_URL, { method: 'POST', body: formData })
                    .then(() => statusText.innerText = "✅ Berhasil dikirim!")
                    .catch(() => statusText.innerText = "❌ Gagal mengirim.");
            }, 'image/png');
        });

        // Simpan Foto
        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'eid-photo.png';
            link.href = photo.src;
            link.click();
        });
    </script>
</body>
</html>
