<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eid Mubarak Photobooth 🌙</title>
    
    <style>
        /* CSS LANGSUNG DI SINI */
        :root {
            --emerald: #064e3b;
            --gold: #d4af37;
            --white: #ffffff;
            --glass: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #064e3b 0%, #065f46 100%);
            background-attachment: fixed;
            color: var(--white);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            text-align: center;
            background: var(--glass);
            backdrop-filter: blur(15px);
            padding: 40px 30px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        h1 { 
            margin: 0;
            color: var(--gold);
            font-size: 2rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-weight: 300;
            margin-bottom: 30px;
            opacity: 0.8;
            letter-spacing: 1px;
        }

        /* Container Kamera & Frame */
        .booth-wrapper {
            position: relative;
            border: 4px solid var(--gold);
            border-radius: 20px;
            overflow: hidden;
            background: #000;
            margin-bottom: 25px;
            line-height: 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        #video {
            width: 100%;
            height: auto;
            transform: scaleX(-1); /* Efek Cermin */
        }

        /* Overlay Frame (Ganti frame.png dengan URL bingkai transparan) */
        #frame-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background-image: url('https://www.transparenttextures.com/patterns/arabesque.png'); /* Pattern sementara */
            border: 20px solid transparent;
            border-image: url('https://i.ibb.co/L8m6v8p/frame-placeholder.png') 30 round; /* Contoh frame */
            z-index: 10;
        }

        /* Tombol */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        button {
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        #snap {
            background: var(--gold);
            color: var(--emerald);
        }

        #snap:hover {
            background: #ffdf7e;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
        }

        #download {
            background: var(--white);
            color: var(--emerald);
        }

        #download:hover {
            background: #f0f0f0;
            transform: translateY(-2px);
        }

        /* Hasil Foto */
        #result-container {
            margin-top: 30px;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        #photo {
            width: 100%;
            border-radius: 15px;
            border: 2px solid var(--gold);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🌙 Eid Mubarak</h1>
            <p class="subtitle">Klik tombol di bawah untuk berfoto</p>
        </header>

        <div class="booth-wrapper">
            <video id="video" autoplay playsinline></video>
            <div id="frame-overlay"></div>
        </div>

        <div class="controls">
            <button id="snap">Ambil Foto Spesial 📸</button>
            <button id="download" style="display:none;">Simpan ke Galeri ✨</button>
        </div>

        <div id="result-container">
            <p>Hasil Foto Kamu:</p>
            <img id="photo" alt="Hasil foto kamu">
        </div>

        <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const snap = document.getElementById('snap');
        const photo = document.getElementById('photo');
        const downloadBtn = document.getElementById('download');
        const resultContainer = document.getElementById('result-container');
        const context = canvas.getContext('2d');

        // Akses Kamera
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" }, 
                    audio: false 
                });
                video.srcObject = stream;
            } catch (err) {
                console.error("Error akses kamera:", err);
                alert("Kamera tidak bisa diakses. Pastikan kamu memberi izin.");
            }
        }

        // Ambil Foto
        snap.addEventListener('click', () => {
            // Set ukuran canvas sesuai video
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            // Gambar video ke canvas (Mirror balik agar hasil foto tidak terbalik)
            context.save();
            context.scale(-1, 1);
            context.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
            context.restore();

            // Tambahkan Frame (Contoh: Kotak Gold)
            context.strokeStyle = "#d4af37";
            context.lineWidth = 40;
            context.strokeRect(0, 0, canvas.width, canvas.height);
            
            // Tampilkan Gambar
            const dataDataURL = canvas.toDataURL('image/png');
            photo.src = dataDataURL;
            resultContainer.style.display = 'block';
            downloadBtn.style.display = 'flex';

            // Scroll otomatis ke hasil foto
            resultContainer.scrollIntoView({ behavior: 'smooth' });
        });

        // Download Foto
        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'Eid-Mubarak-Photo.png';
            link.href = photo.src;
            link.click();
        });

        // Jalankan Kamera saat load
        startCamera();
    </script>
</body>
</html>
