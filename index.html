<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday! 🎂</title>
    <style>
        /* Gaya Dasar */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #ffe4e1;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        /* Overlay Awal */
        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ff6b6b;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            color: white;
            transition: 0.8s;
        }

        /* Konten Utama */
        .container {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 400px;
            z-index: 1;
        }

        h1 { color: #ff4757; }
        p { color: #57606f; line-height: 1.6; }

        .btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.3s;
            margin-top: 15px;
        }

        .btn:hover { background: #ff6b81; transform: scale(1.05); }

        /* Animasi Balon */
        .balloon {
            position: absolute;
            bottom: -100px;
            width: 50px;
            height: 70px;
            background: #ff4757;
            border-radius: 50%;
            opacity: 0.7;
            z-index: 0;
            animation: float 6s infinite ease-in;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-120vh) rotate(20deg); opacity: 0; }
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="overlay">
        <h1>Ada Pesan Untukmu! 🎁</h1>
        <button class="btn" onclick="startSurprise()">Buka Kado</button>
    </div>

    <div class="container">
        <h1 id="title">Happy Birthday! ✨</h1>
        <p id="message">Semoga hari-harimu penuh dengan kebahagiaan, tawa, dan semua impianmu tercapai!</p>
        <button class="btn" onclick="showSurprise()">Klik untuk Kejutan</button>
        <p id="secret" class="hidden" style="margin-top: 20px; font-weight: bold; color: #ff4757;">
            🎈 Kamu luar biasa! Traktirannya ditunggu ya! 🎈
        </p>
    </div>

    <script>
        function startSurprise() {
            document.getElementById('overlay').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('overlay').style.display = 'none';
                createBalloons();
            }, 800);
        }

        function showSurprise() {
            const secret = document.getElementById('secret');
            secret.classList.toggle('hidden');
        }

        function createBalloons() {
            const colors = ['#ff4757', '#747d8c', '#ffa502', '#2ed573', '#1e90ff'];
            for (let i = 0; i < 15; i++) {
                setTimeout(() => {
                    const balloon = document.createElement('div');
                    balloon.className = 'balloon';
                    balloon.style.left = Math.random() * 100 + 'vw';
                    balloon.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    balloon.style.animationDuration = (Math.random() * 3 + 4) + 's';
                    document.body.appendChild(balloon);
                }, i * 300);
            }
        }
    </script>
</body>
</html>
