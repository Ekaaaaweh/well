<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eid Mubarak - Digital Greeting & Photobooth 🌙</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --emerald: #064e3b;
            --gold: #d4af37;
            --white: #ffffff;
            --glass: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at center, #065f46 0%, #042f24 100%);
            color: var(--white);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 500px;
            width: 90%;
            perspective: 1000px;
        }

        /* --- DASHBOARD UCAPAN --- */
        #dashboard {
            background: var(--glass);
            backdrop-filter: blur(20px);
            padding: 50px 30px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            transition: all 0.8s ease;
        }

        .eid-icon { font-size: 4rem; margin-bottom: 15px; display: block; }
        
        h1 { 
            font-family: 'Playfair Display', serif;
            color: var(--gold);
            font-size: 2.2rem;
            margin: 0;
            line-height: 1.2;
        }

        .greeting-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 15px;
            margin: 25px 0;
            border-left: 4px solid var(--gold);
        }

        .greeting-text {
            font-style: italic;
            opacity: 0.9;
            line-height: 1.6;
            font-weight: 300;
            margin: 0;
        }

        /* --- FITUR UTAMA (PHOTOBOOTH) --- */
        #photobooth-section {
            display: none; /* Sembunyi di awal */
            background: var(--glass);
            backdrop-filter: blur(20px);
            padding: 25px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: slideUp 0.8s ease forwards;
        }

        .booth-wrapper {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            border: 3px solid var(--gold);
            background: #000;
            line-height: 0;
            margin-bottom: 20px;
        }

        #video { width: 100%; height: auto; transform: scaleX(-1); }

        #frame-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            box-shadow: inset 0 0 0 15px var(--gold);
            opacity: 0.5;
            z-index: 5;
        }

        /* --- TOMBOL --- */
        .btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-gold { background: var(--gold); color: var(--emerald); }
        .btn-gold:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(212, 175, 55, 0.3); }

        .btn-white { background: var(--white); color: var(--emerald); margin-top: 15px; }

        /* --- HASIL FOTO --- */
        #result-container {
            margin-top: 25px;
            display: none;
        }
        #photo { width: 100%; border-radius: 15px; border: 2px solid var(--gold); }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="dashboard">
            <span class="eid-icon">🕌</span>
            <h1>Selamat Hari Raya<br>Idul Fitri 1447 H</h1>
            
            <div class="greeting-card">
                <p class="greeting-text">
                    "Taqabbalallahu minna wa minkum. <br>
                    Moga keberkahan menyelimuti hati, dan kemenangan menjadi milik kita bersama."
                </p>
            </div>
            
            <p style="font-size: 0.85rem; margin-bottom: 20px; opacity: 0.7;">
                Klik tombol di bawah untuk mengaktifkan fitur kamera dan berfoto bersama.
            </p>

            <button id="activate-camera-btn" class="btn btn-gold">
                Aktifkan Fitur Photobooth ✨
            </button>
        </div>

        <div id="photobooth-section">
            <h2 style="text-align: center; color: var(--gold); margin-top: 0;">Photobooth 📸</h2>
            
            <div class="booth-wrapper">
                <video id="video" autoplay playsinline></video>
                <div id="frame-overlay"></div>
            </div>

            <button id="snap" class="btn btn-gold">Ambil Foto Spesial ✨</button>
            
            <div id="result-container">
                <p style="text-align: center;">Hasil Foto Kamu:</p>
                <img id="photo" alt="Hasil foto">
                <button id="download" class="btn btn-white">Simpan ke Galeri 📥</button>
            </div>
        </div>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const dashboard = document.getElementById('dashboard');
        const photoboothSection = document.getElementById('photobooth-section');
        const activateBtn = document.getElementById('activate-camera-btn');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const snap = document.getElementById('snap');
        const photo = document.getElementById('photo');
        const downloadBtn = document.getElementById('download');
        const resultContainer = document.getElementById('result-container');
        const context = canvas.getContext('2d');

        // FUNGSI GANDA: Masuk ke fitur & Meminta Izin Kamera
        activateBtn.addEventListener('click', async () => {
            try {
                // Meminta izin kamera saat tombol diklik
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" }, 
                    audio: false 
                });
                
                video.srcObject = stream;

                // Animasi Transisi
                dashboard.style.opacity = '0';
                setTimeout(() => {
                    dashboard.style.display = 'none';
                    photoboothSection.style.display = 'block';
                }, 500);

            } catch (err) {
                console.error("Gagal kamera:", err);
                alert("Mohon ijinkan akses kamera untuk dapat menggunakan fitur Photobooth utama ini.");
            }
        });

        // Logika Ambil Foto
        snap.addEventListener('click', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            context.save();
            context.scale(-1, 1);
            context.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
            context.restore();

            // Frame Gold sederhana pada hasil
            context.strokeStyle = "#d4af37";
            context.lineWidth = 40;
            context.strokeRect(0, 0, canvas.width, canvas.height);

            const dataURL = canvas.toDataURL('image/png');
            photo.src = dataURL;
            resultContainer.style.display = 'block';
            resultContainer.scrollIntoView({ behavior: 'smooth' });
        });

        // Download
        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'Eid-Mubarak-Photo.png';
            link.href = photo.src;
            link.click();
        });
    </script>
</body>
</html>
